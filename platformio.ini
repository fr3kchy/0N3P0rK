; fR3k - demon Tamagotchi + GPS on M5Cardputer / Cardputer ADV
; Based on 0N3P0rK by lexilexiko
;
; v3.0.4-lab: GPS page v1 restore, WPA-sec overhaul (sort modes,
; recommend-upload colour highlight, auto-pull on open, NEW badge),
; Wigle.net upload client, voice fix (CUNT jingle now fires through
; playPersonality() when voiceWord == CUNT). Trip odometer, GPX
; export, root-menu "N new" badge, AUTO SYNC setting.
;
; v3.0.3-lab: spectrum-sky overlay removed from the sky render path
; per operator feedback (visual noise). Settings row id 23 is forced
; off; the source in src/piglet/spectrum_sky.{h,cpp} is preserved for
; future re-enable. Main loop no longer calls SpectrumSky::begin().
;
; v3.0.2-lab: per-screen audio gate. MENU and ATTACK root navigation
; is now silent by default - SFX::setMenuMode(true) from App::setMode()
; suppresses the nav-tap, personality voice, and the sequence pump.
; MENU SOUND and MENU TAP settings rows in the SCENE page give the
; operator per-keystroke control. Personality voice still plays on
; FARM and in every in-game mode (IR, spectrum, GPS, etc).
;
; v3.0.1-lab: queue-bypassing SFX::playNav() so every UI keypress
; lands in time with the screen update. Mute-mask leak in update()
; fixed so personality events survive an IR blast. SND_CLICK /
; SND_MENU_CLICK dispatcher arms demoted to no-ops (legacy compat
; only); all 39 CLICK / MENU_CLICK call sites migrated to playNav().
;
; v3.0.0-lab: default env (`m5cardputer`) ships the offensive code path
; behind the Lab runtime gate (sha-1 of "666"). Legacy v2-style safe
; distributable is the `m5cardputer-safe` env (FR3K_SAFE_BUILD=1).

[platformio]
default_envs = m5cardputer

[env:m5cardputer]
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
custom_version = 3.0.4-fr3k-lab
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stack_StampS3
    -DBOARD_NAME=\"M5Cardputer\"
    -DBUTTON_GPIO_DEFAULT=0
    -DCONFIG_MDNS_HOSTNAME=\"fr3k\"
    ; v3 default: offensive code is compiled in, but the Lab unlock
    ; runtime gate blocks access to it on the root menu until the
    ; operator types 666 in the new LAB UNLOCK settings page.
    -DFR3K_SAFE_BUILD=0
    -DFR3K_SAFE_DEFAULT=0
    -Wl,--allow-multiple-definition
    -include src/build_info.h
    -include src/compat.h
    -Os

lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.2

extra_scripts = pre:scripts/pre_build.py

[env:m5cardputer-safe]
; Legacy v2 strict-safe distributable. Same code base, but the FR3K_SAFE_BUILD
; define hides the offensive launch paths (doAction / hotkey / menu / main
; lifecycle) behind compile-time guards. Use this env to produce the v2-style
; `fr3k-cardputer-v3-safe.bin` for users who want the same defaults as v2.0.0.
platform = espressif32@6.12.0
board = m5stack-stamps3
framework = arduino
custom_version = 3.0.4-fr3k-safe
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800

build_flags =
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    -DARDUINO_M5Stack_StampS3
    -DBOARD_NAME=\"M5Cardputer\"
    -DBUTTON_GPIO_DEFAULT=0
    -DCONFIG_MDNS_HOSTNAME=\"fr3k\"
    -DFR3K_SAFE_BUILD=1
    -DFR3K_SAFE_DEFAULT=1
    -Wl,--allow-multiple-definition
    -include src/build_info.h
    -include src/compat.h
    -Os

lib_deps =
    m5stack/M5Unified@^0.2.11
    m5stack/M5Cardputer@^1.1.1
    bblanchon/ArduinoJson@^7.4.2

extra_scripts = pre:scripts/pre_build.py
