<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>0N3P0rK — Web Installer</title>
  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600;700&display=swap');

    :root {
      --bg: #07071a;
      --card: #0e0e28;
      --accent: #00f5ff;
      --pink: #ff2d95;
      --yellow: #ffe566;
      --green: #7cff6b;
      --text: #e8e8ff;
      --muted: #7a7a9a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.5rem 1rem 3rem;
      background-image: 
        radial-gradient(ellipse at 20% 0%, rgba(0, 245, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(255, 45, 149, 0.07) 0%, transparent 50%);
    }

    .header { text-align: center; margin-bottom: 2.5rem; }

    .pig {
      font-size: 3.8rem;
      line-height: 1;
      margin-bottom: 0.6rem;
      filter: drop-shadow(0 0 18px rgba(255, 45, 149, 0.4));
      animation: float 3.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .title {
      font-family: 'Press Start 2P', system-ui;
      font-size: clamp(1.4rem, 5vw, 2rem);
      letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.7rem;
    }

    .tagline {
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 380px;
      line-height: 1.5;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(0, 245, 255, 0.18);
      border-radius: 20px;
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.06);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--pink), var(--yellow));
    }

    .version-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(0, 245, 255, 0.12);
      border: 1px solid rgba(0, 245, 255, 0.25);
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.6rem;
    }

    .version-badge span {
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
    }

    .install-area {
      margin: 1.4rem 0 1.6rem;
    }

    esp-web-install-button {
      --esp-tools-button-color: #00f5ff;
      --esp-tools-button-text-color: #07071a;
      --esp-tools-button-border-radius: 12px;
      width: 100%;
    }

    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      line-height: 1.55;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 0.9rem 1rem;
      text-align: left;
    }

    .hint b { color: var(--text); }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.8rem 1.4rem;
      margin-top: 2.4rem;
      font-size: 0.88rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover { color: var(--pink); }

    footer {
      margin-top: 3rem;
      font-size: 0.72rem;
      color: #4a4a6a;
      text-align: center;
      line-height: 1.6;
    }

    footer a { color: #6a6a8a; }
  </style>
</head>
<body>

  <div class="header">
    <div class="pig">🐷</div>
    <h1 class="title">0N3P0rK</h1>
    <p class="tagline">
      Свинка на ферме + сарай с инструментами<br>
      для M5Cardputer &amp; Cardputer ADV
    </p>
  </div>

  <div class="card">
    <div class="version-badge">
      <span></span> v1.3.0 · ESP32-S3
    </div>

    <div class="install-area">
      <esp-web-install-button id="installBtn" style="display:none">
        <button slot="activate">Установить прошивку</button>
      </esp-web-install-button>
    </div>

    <div class="hint">
      • Только <b>Chrome / Edge / Opera</b><br>
      • Подключи Cardputer по USB-C<br>
      • Выбери COM-порт (VID 303A)<br>
      • SD-карту лучше вставить заранее
    </div>
  </div>

  <div class="links">
    <a href="https://github.com/lexilexiko/0N3P0rK" target="_blank">GitHub</a>
    <a href="https://github.com/lexilexiko/0N3P0rK/releases" target="_blank">Все релизы</a>
  </div>

  <footer>
    MIT License · Lab use only<br>
    <a href="https://github.com/lexilexiko">lexilexiko</a>
  </footer>

</body>
</html>
